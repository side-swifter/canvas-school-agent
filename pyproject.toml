[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-school-agent"
version = "0.1.0"
description = "Scheduled course document and deadline intelligence service"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "python-dateutil>=2.9,<3", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
school-agent = "school_agent.main:main"

[tool.setuptools.packages.find]
include = ["school_agent*"]
